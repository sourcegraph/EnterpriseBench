# Config Drift: webpack module rule ordering vs Babel plugin resolution order

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "webpack-babel-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "config-drift-dual-webpack-babel-001"
suite = "platform_engineering"
task_type = "config_drift"
difficulty = "hard"
estimated_duration_minutes = 30
session_type = "single"
description = "Detect configuration drift between webpack loader execution order and Babel plugin/preset resolution order"
prompt = """
A build team reports that their webpack build produces different output depending
on whether files are processed by babel-loader alone or by a chain of loaders.
Specifically, decorators and class properties are transformed differently when
webpack's module rules apply multiple loaders in sequence vs when Babel applies
its plugins in its own ordering.

The root cause is a drift between webpack's loader execution order (right-to-left /
bottom-to-top in the rules array) and Babel's plugin resolution order (plugins
run before presets, plugins run first-to-last, presets run last-to-first).

Your task:
1. Find where webpack implements module rule matching and loader execution order —
   trace from NormalModule through the loader runner to identify how multiple
   matching rules and their loaders are ordered and executed.
2. Find where Babel resolves and orders its plugins and presets — trace from
   @babel/core's config loading through plugin ordering to identify the
   execution sequence for transforms.
3. Identify the drift points where webpack's loader ordering assumptions conflict
   with Babel's plugin ordering — particularly for decorator and class property
   transforms that are order-sensitive.
4. Document each drift point with source files from both repos.

Document in your answer (use these JSON fields):
{
  "drift_points": [
    {
      "config_key": "<ordering rule or configuration>",
      "webpack_behavior": "<how webpack orders execution>",
      "webpack_source_file": "<path in webpack repo>",
      "babel_behavior": "<how Babel orders plugins>",
      "babel_source_file": "<path in babel repo>",
      "impact": "<how this drift affects build output>"
    }
  ]
}
"""

[[repos]]
url = "https://github.com/webpack/webpack"
rev = "v5.88.2"
path = "webpack"
role = "primary"

[[repos]]
url = "https://github.com/babel/babel"
rev = "v7.23.9"
path = "babel"
role = "consumer"

[metadata]
languages = ["javascript"]
total_loc = 500_000
dependency_depth = 2
frameworks = ["webpack", "babel"]
multi_repo_pattern = "investigate"

[[checkpoints]]
name = "config_valid"
weight = 0.20
verifier = "checks/check_config_valid.sh"
description = "Agent produces valid drift report JSON"
timeout_seconds = 60

[[checkpoints]]
name = "drift_points"
weight = 0.45
verifier = "checks/check_drift_points.sh"
description = "Agent identifies drift between webpack and Babel ordering"
timeout_seconds = 120

[[checkpoints]]
name = "expected_values"
weight = 0.35
verifier = "checks/check_expected_values.sh"
description = "Agent documents correct ordering semantics from both repos"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = ["config"]

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Understanding loader execution ordering in webpack and plugin ordering in Babel requires cross-repo search to trace the execution pipeline in both tools"

[ground_truth]
tiers = ["deterministic"]

[[ground_truth.required_files]]
path = "lib/NormalModule.js"
repo = "webpack"
confidence = 0.95
source = "deterministic"

[[ground_truth.required_files]]
path = "packages/babel-core/src/config/full.ts"
repo = "babel"
confidence = 0.90
source = "deterministic"

[[ground_truth.sufficient_files]]
path = "lib/rules/RuleSetCompiler.js"
repo = "webpack"
confidence = 0.85

[[ground_truth.sufficient_files]]
path = "packages/babel-core/src/transformation/index.ts"
repo = "babel"
confidence = 0.80
