verifier = "checks/check_trigger_conditions.sh"
description = "Agent identifies the conditions producing the symptom"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = []

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Reflection regression is split between grpc-cpp's reflection service and protobuf's descriptor pool. The empty-descriptor bug requires cross-repo navigation across the language interop boundary."

