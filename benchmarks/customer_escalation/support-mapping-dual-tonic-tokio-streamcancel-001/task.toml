# support_code_mapping: Map customer tonic gRPC client stream stuck after server cancel to the tonic Streaming / tokio mpsc cancellation boundary

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "rust-tonic-tokio-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "support-mapping-dual-tonic-tokio-streamcancel-001"
suite = "customer_escalation"
task_type = "support_code_mapping"
difficulty = "hard"
estimated_duration_minutes = 35
session_type = "single"
description = "Map customer tonic gRPC client stream stuck after server cancel to the tonic Streaming / tokio mpsc cancellation boundary"
prompt = """
A customer reports that their tonic-based gRPC client occasionally
hangs forever on the next() call of a server-streaming RPC after the
server explicitly cancels the stream with Status::cancelled(). The
underlying HTTP/2 RST_STREAM is observed in tcpdump, but the
Streaming<T> never returns None.

Your task:
1. Find where tonic's Streaming type wraps the inner mpsc channel
   and how it converts a Status::cancelled into a stream end.
2. Find where tokio's mpsc Receiver decides between Some(item) and
   None on a closed channel, and how it interacts with sender drop
   ordering.
3. Trace the cross-repo path: tonic Streaming::poll_next -> mpsc
   Receiver::poll_recv -> server-side Status::cancelled emit ->
   sender drop -> Receiver close. Cite each file and the function
   responsible.
4. Identify why a Status::cancelled body frame on the wire does
   not always close tonic's mpsc sender immediately when h2 stream
   reset arrives at the client, and how an outstanding clone of
   the sender keeps the client receiver hanging.
"""

[[repos]]
url = "https://github.com/hyperium/tonic"
rev = "v0.11.0"
path = "tonic"
role = "primary"

[[repos]]
url = "https://github.com/tokio-rs/tokio"
rev = "tokio-1.36.0"
path = "tokio"
role = "upstream"

[metadata]
languages = ["rust"]
total_loc = 300000
dependency_depth = 2
frameworks = ["tonic", "tokio", "h2"]
multi_repo_pattern = "investigate"

[[checkpoints]]
name = "error_source"
weight = 0.4
verifier = "checks/check_error_source.sh"
description = "Agent identifies the correct source files across both repos"
timeout_seconds = 120

[[checkpoints]]
name = "error_chain"
weight = 0.3
verifier = "checks/check_error_chain.sh"
description = "Agent traces the full propagation chain across the boundary"
timeout_seconds = 120

[[checkpoints]]
name = "trigger_conditions"
weight = 0.3
verifier = "checks/check_trigger_conditions.sh"
description = "Agent identifies the conditions producing the symptom"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = []

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Cancel propagation is split between tonic's gRPC layer and tokio's mpsc semantics. The hang requires cross-repo navigation to see why stream RST does not unblock the receiver."

