# support_code_mapping: Map customer React Suspense boundary unmount on Relay store invalidation to the React reconciler / Relay environment boundary

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "react-relay-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "support-mapping-dual-react-relay-suspense-001"
suite = "customer_escalation"
task_type = "support_code_mapping"
difficulty = "hard"
estimated_duration_minutes = 35
session_type = "single"
description = "Map customer React Suspense boundary unmount on Relay store invalidation to the React reconciler / Relay environment boundary"
prompt = """
A customer reports that their React 18 + Relay 16 page silently unmounts
and remounts a Suspense boundary every time a Relay store invalidation
fires from a mutation, even though no fragment subscribed to that
boundary actually reads the invalidated record. The whole subtree's
client-side state is lost.

Your task:
1. Find where React's reconciler decides whether a Suspense boundary
   re-renders or unmounts after a context update.
2. Find where Relay's RelayModernEnvironment publishes a store
   invalidation and how it notifies subscribers via
   useSubscribeToInvalidationState.
3. Trace the cross-repo path: Relay store mutation commit ->
   notify subscribers -> useFragment / useLazyLoadQuery hook re-eval
   -> React useSyncExternalStore subscription -> reconciler
   schedules update -> Suspense boundary re-render decision. Cite
   each file and the function or attribute responsible.
4. Identify why a global store-version bump can transitively cause
   any consumer of useFragment under the Suspense boundary to
   re-throw a promise, forcing the boundary to fall back.
"""

[[repos]]
url = "https://github.com/facebook/react"
rev = "v18.2.0"
path = "react"
role = "upstream"

[[repos]]
url = "https://github.com/facebook/relay"
rev = "v16.2.0"
path = "relay"
role = "primary"

[metadata]
languages = ["javascript", "typescript"]
total_loc = 900000
dependency_depth = 2
frameworks = ["react", "relay", "graphql"]
multi_repo_pattern = "investigate"

[[checkpoints]]
name = "error_source"
weight = 0.4
verifier = "checks/check_error_source.sh"
description = "Agent identifies the correct source files across both repos"
timeout_seconds = 120

[[checkpoints]]
name = "error_chain"
weight = 0.3
verifier = "checks/check_error_chain.sh"
description = "Agent traces the full propagation chain across the boundary"
timeout_seconds = 120

[[checkpoints]]
name = "trigger_conditions"
weight = 0.3
verifier = "checks/check_trigger_conditions.sh"
description = "Agent identifies the conditions producing the symptom"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = []

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "Tracing why a Relay store invalidation unmounts a React Suspense boundary requires cross-repo navigation: Relay owns the store-subscriber graph, React owns the Suspense lifecycle. Neither repo alone explains the unmount."

