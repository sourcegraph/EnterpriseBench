# support_code_mapping: Map customer FastAPI request-body field-drop to the Pydantic v2 model_validator chain integration boundary

difficulty_stratum = "dual_repo"
mcp_suite = "eb_v1"
repo_set_id = "fastapi-pydantic-ecosystem"
org_scale = true
verification_modes = ["deterministic", "llm_curator"]

[task]
id = "support-mapping-dual-fastapi-pydantic-validator-001"
suite = "customer_escalation"
task_type = "support_code_mapping"
difficulty = "hard"
estimated_duration_minutes = 30
session_type = "single"
description = "Map customer FastAPI request-body field-drop to the Pydantic v2 model_validator chain integration boundary"
prompt = """
A customer reports that after upgrading from Pydantic v1 to Pydantic v2
their FastAPI POST endpoint silently drops a discriminated-union field on
the request body. The endpoint returns 200 OK, the response body shows the
field as None, but the client clearly sent it. No 422 error is raised.

Your task:
1. Find where FastAPI builds a request-body parameter from a Pydantic
   model and validates it before invoking the route handler.
2. Find where Pydantic v2 evaluates a discriminated union and how
   model_validator(mode='before') interacts with discriminator field
   resolution.
3. Trace the cross-repo flow: FastAPI dependency injection -> body
   parameter solving -> Pydantic model_validate_json -> discriminator
   resolution -> field assignment. Cite each file and function.
4. Identify why a model_validator(mode='before') that pre-processes
   incoming JSON can silently strip the discriminator key, leading to
   the union resolving to its default variant with the field set to None.
"""

[[repos]]
url = "https://github.com/tiangolo/fastapi"
rev = "0.110.0"
path = "fastapi"
role = "primary"

[[repos]]
url = "https://github.com/pydantic/pydantic"
rev = "v2.6.4"
path = "pydantic"
role = "upstream"

[metadata]
languages = ["python"]
total_loc = 200000
dependency_depth = 2
frameworks = ["fastapi", "pydantic", "starlette"]
multi_repo_pattern = "investigate"

[[checkpoints]]
name = "error_source"
weight = 0.4
verifier = "checks/check_error_source.sh"
description = "Agent identifies the correct source files across both repos"
timeout_seconds = 120

[[checkpoints]]
name = "error_chain"
weight = 0.3
verifier = "checks/check_error_chain.sh"
description = "Agent traces the full propagation chain across the boundary"
timeout_seconds = 120

[[checkpoints]]
name = "trigger_conditions"
weight = 0.3
verifier = "checks/check_trigger_conditions.sh"
description = "Agent identifies the conditions producing the symptom"
timeout_seconds = 120

[artifacts]
required = ["answer"]
optional = []

[tool_access]
expected_mcp_benefit = "high"
mcp_benefit_rationale = "FastAPI's body validation funnels request data into Pydantic, but the field-drop bug lives at the discriminator resolver inside Pydantic's core schema. Cross-repo navigation is required to see why a FastAPI 200 OK is consistent with the model dropping the field."

