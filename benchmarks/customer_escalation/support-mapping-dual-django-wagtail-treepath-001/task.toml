mcp_benefit_rationale = "Tracing get_descendants() from Wagtail's Page model into Django's QuerySet path filter requires cross-repo navigation: Wagtail defines the MP_Node-based Page tree, Django enforces the SQL builder choice. The query plan regression is invisible from either repo alone."

