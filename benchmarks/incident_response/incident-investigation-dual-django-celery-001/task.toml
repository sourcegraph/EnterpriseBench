weight = 0.35
verifier = "checks/check_connection_lifecycle.sh"
description = "Agent identifies Django connection management and CONN_MAX_AGE behavior"
timeout_seconds = 120

[[checkpoints]]
name = "worker_lifecycle"
weight = 0.35
verifier = "checks/check_worker_lifecycle.sh"
description = "Agent identifies Celery prefork worker child lifecycle and cleanup hooks"
timeout_seconds = 120

[[checkpoints]]
name = "root_cause"
weight = 0.30
verifier = "checks/check_root_cause.sh"
description = "Agent identifies the connection-process lifecycle mismatch as root cause"
