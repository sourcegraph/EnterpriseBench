[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eb-verify"
version = "0.2.0"
description = "EnterpriseBench verification library"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "jsonschema>=4.20",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Real embedding backend for fact_coverage.SentenceTransformerEmbedder.
# Not a base dependency: pulls in torch, which is unneeded for the default
# TF-IDF embedder and too heavy to force onto every eb-verify install.
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
eb-verify = "eb_verify.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
