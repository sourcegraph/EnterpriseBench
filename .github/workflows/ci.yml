name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install pytest jsonschema tomli
          pip install -e lib/
      - name: Run tests
        run: python3 -m pytest tests/ -v --tb=short -m "not network and not docker"
      - name: Audit task consistency
        run: python3 scripts/audit_consistency.py
      - name: Validate shell scripts
        run: |
          find benchmarks -name "*.sh" -not -path "*/_archived/*" | while read f; do
            bash -n "$f" || exit 1
          done

  soundness:
    # Mutation-tests every checkpoint verifier (empty / garbage / gold sweep).
    # A FALSE POSITIVE — a verifier scoring > 0 with no agent output at all —
    # is the hard soundness failure that makes the benchmark untrustworthy, so
    # it blocks. The --strict sweep additionally surfaces garbage-credit and
    # gold-zero *risk* warnings; those run informationally (continue-on-error)
    # so they are visible in the log and tracked toward the threats-to-validity
    # triage without turning this into a permanently-red required check.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install pytest jsonschema tomli
          pip install -e lib/
      - name: Verifier soundness gate (false positives block)
        run: python3 scripts/validation/verifier_mutation_test.py benchmarks/ --json
      - name: Verifier risk sweep (strict, informational)
        continue-on-error: true
        run: python3 scripts/validation/verifier_mutation_test.py benchmarks/ --json --strict
      - name: Verifier contamination scan (foreign-path blocks)
        # High-precision foreign-path detector: a multi-repo verifier referencing a
        # repo dir outside its task's declared [[repos]] is copy-pasted-from-wrong-task
        # contamination (the y50/awa defect class). --strict exits nonzero on any such
        # hit so it cannot regress. Foreign-token hits print informationally (they have
        # benign comment/domain matches) and do not affect the exit code.
        run: python3 scripts/validation/verifier_contamination_scan.py benchmarks/ --strict
